<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CoreHeart</title>
<style>
  :root { color-scheme: dark; --bg:#0b0c10; --panel:#14161d; --line:rgba(245,245,240,.10); --text:#f5f5f0; --dim:rgba(245,245,240,.55); --accent:#4caf7d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { height: 100%; display: grid; grid-template-rows: auto 3px 1fr; gap: .6rem; padding: 1rem 1.4rem 1.2rem; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 1rem; }
  .clock { flex: none; }
  .clock .time { font-size: 2.2rem; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock .date { font-size: .8rem; color: var(--dim); margin-top: .2rem; }
  .nav { flex: 1; display: flex; gap: .5rem; justify-content: center; overflow-x: auto; scrollbar-width: none; }
  .grp { flex: none; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .3rem .4rem .15rem; border-radius: 1.2rem; border: 1px solid var(--line); }
  .gl { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .gi { display: flex; gap: .1rem; }
  .nav::-webkit-scrollbar { display: none; }
  .tab { flex: none; width: 3.7rem; padding: .5rem 0 .4rem; border-radius: 1rem; border: 1px solid transparent; background: none; display: flex; flex-direction: column; align-items: center; gap: .15rem; opacity: .6; transition: opacity .15s, background .15s; }
  .tab span:first-child { font-size: 1.55rem; line-height: 1; }
  .tab span:last-child { font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; }
  .tab.on { opacity: 1; background: rgba(245,245,240,.08); border-color: var(--accent); }
  .tab:active { transform: scale(.94); }
  .priv { flex: none; display: flex; align-items: center; gap: .5rem; padding: .7rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: .9rem; }
  .priv.on { border-color: #ffb74d; color: #ffb74d; background: rgba(255,183,77,.1); }
  .bar { background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* stage */
  .stage { position: relative; min-height: 0; }
  .card { position: absolute; inset: 0; border-radius: 1.75rem; border: 1px solid var(--line); padding: 2rem 2.4rem; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(110% 80% at 0% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), var(--panel);
    opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .45s, transform .45s; }
  .card.show { opacity: 1; transform: none; pointer-events: auto; }
  .card h2 { margin: 0 0 1.4rem; display: flex; align-items: baseline; gap: .9rem; font-size: .95rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .tag { margin-left: auto; font-size: .7rem; letter-spacing: .08em; color: var(--dim); border: 1px dashed var(--line); padding: .15rem .55rem; border-radius: 999px; }
  .big { font-size: clamp(2rem, 4.4vw, 3.6rem); font-weight: 300; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  .sub { font-size: 1.3rem; color: var(--dim); margin: .6rem 0 0; line-height: 1.4; }
  .rows { display: grid; gap: .2rem; margin-top: .4rem; }
  .row { display: flex; align-items: baseline; gap: 1.2rem; padding: .85rem 0; border-bottom: 1px solid var(--line); font-size: clamp(1.2rem, 2.2vw, 1.7rem); }
  .row .k { flex: none; width: 9rem; color: var(--accent); font-variant-numeric: tabular-nums; font-size: .85em; }
  .row .m { margin-left: auto; color: var(--dim); font-size: .75em; text-align: right; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; flex: 1; min-height: 0; }
  .tile { border: 1px solid var(--line); border-radius: 1.2rem; padding: 1.4rem; background: rgba(0,0,0,.18); }
  .tile h3 { margin: 0 0 .5rem; font-size: 1.6rem; font-weight: 500; }
  .tile p { margin: .3rem 0; color: var(--dim); font-size: 1.1rem; line-height: 1.4; }
  .chips { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  .chip { padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid var(--line); background: rgba(245,245,240,.06); font-size: 1.05rem; }
  .chip.warn { border-color: #ff8a65; color: #ff8a65; }
  .stats { display: flex; gap: 2.4rem; margin-top: 1.4rem; flex-wrap: wrap; }
  .stat b { display: block; font-size: 2.8rem; font-weight: 300; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: .95rem; }
  .cat { margin: .75rem 0; }
  .cat .l { display: flex; justify-content: space-between; font-size: 1.25rem; margin-bottom: .4rem; }
  .cat .l span:last-child { color: var(--dim); }
  .cat .bar { height: .7rem; }
  .cat.hot .bar i { background: #ff8a65; }
  .hours { display: flex; align-items: flex-end; gap: 4px; height: 6rem; margin-top: 1.4rem; }
  .hours i { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; }
  .hours i.now { opacity: 1; outline: 2px solid var(--text); }
  .sec { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: .6rem; }
  .clock .milan { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--dim); margin-top: .15rem; }
  .mdot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--dim); }
  .mdot.ok { background: #4caf7d; }
  .foot { margin-top: auto; padding-top: 1rem; color: var(--dim); font-size: .95rem; }

  @media (max-width: 860px), (orientation: portrait) {
    .top { flex-wrap: wrap; } .nav { order: 3; flex-basis: 100%; justify-content: flex-start; }
    .grid2 { grid-template-columns: 1fr; } .card { padding: 1.4rem; } .row .k { width: 6rem; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }

  /* ---- visual polish ---- */
  body { background: radial-gradient(90% 60% at 85% -10%, color-mix(in srgb, var(--accent) 16%, #0b0c10), #0b0c10 70%); transition: background .8s; }
  .card { box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); }
  .tab.on { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 40%, transparent); }
  .tile { border-left: 4px solid var(--accent); background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.01)); }
  .chip { background: rgba(255,255,255,.07); }
  .cat .bar { height: .8rem; }
  .cat .bar i { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, #000), var(--accent)); border-radius: 999px; }
  .cat.hot .bar i { background: linear-gradient(90deg, #ff7043, #ffab91); }
  .ev { display: flex; align-items: center; gap: 1.2rem; padding: 1rem 1.3rem; margin-bottom: .8rem; border-radius: 1.2rem; border-left: 4px solid var(--accent);
    background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.015)); font-size: clamp(1.2rem, 2.2vw, 1.7rem); }
  .ev .when { flex: none; min-width: 10rem; padding: .35rem .9rem; border-radius: 999px; text-align: center; font-size: .72em; font-weight: 600;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .ev .m { margin-left: auto; color: var(--dim); font-size: .7em; }
  .wx { display: flex; align-items: center; gap: 2rem; }
  .wx-ico { font-size: clamp(5rem, 11vw, 8.5rem); line-height: 1; filter: drop-shadow(0 10px 28px color-mix(in srgb, var(--accent) 50%, transparent)); }
  .wx-temp { font-size: clamp(4rem, 9vw, 7rem); font-weight: 200; line-height: 1; letter-spacing: -.04em; }
  .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; margin-top: auto; }
  .day { border-radius: 1.2rem; padding: .9rem; text-align: center; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .day .e { font-size: 2.1rem; } .day b { display: block; font-size: 1.6rem; font-weight: 500; } .day span { color: var(--dim); font-size: .9rem; }
  .donut { position: relative; width: 13rem; height: 13rem; margin: 0 auto; }
  .donut .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.2; }
  .agency { display: flex; gap: 3px; height: 1.1rem; margin: 1.1rem 0; border-radius: 999px; overflow: hidden; }
  .agency i { display: block; height: 100%; }
  .pill { display: flex; align-items: center; gap: .8rem; padding: .8rem 1.2rem; border-radius: 1.1rem; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .pill b { font-size: 2.2rem; font-weight: 300; font-variant-numeric: tabular-nums; } .pill span:last-child { color: var(--dim); }
  .pill .dot { width: .9rem; height: .9rem; border-radius: 50%; flex: none; }
  .map { position: relative; flex: 1; min-width: 0; border-radius: 1.2rem; overflow: hidden; border: 1px solid var(--line); background: #0f1117; }
  .map iframe { width: 100%; height: 100%; border: 0; background: #fff; }

  /* ---- v4 polish ---- */
  .card h2 { align-items: center; font-size: 1.05rem; }
  .hi { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: .85rem; font-size: 1.35rem; letter-spacing: 0; background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .pic { flex: none; width: 6rem; height: 6rem; border-radius: 1.2rem; display: grid; place-items: center; font-size: 3.5rem; object-fit: cover;
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--bg, var(--accent)) 70%, #fff), color-mix(in srgb, var(--bg, var(--accent)) 35%, #000)); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .dish { display: flex; gap: 1.1rem; align-items: center; padding: 1rem; margin-bottom: .9rem; border-radius: 1.2rem; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.01)); }
  .dish h3 { margin: 0 0 .3rem; font-size: 1.4rem; font-weight: 500; } .dish p { margin: 0; color: var(--dim); font-size: 1rem; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 1rem; }
  .si { text-align: center; padding: 1rem .6rem; border-radius: 1.2rem; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .si .pic { margin: 0 auto .6rem; width: 5rem; height: 5rem; font-size: 2.8rem; } .si b { display: block; font-size: 1.2rem; font-weight: 500; } .si span { color: var(--dim); font-size: .85rem; }
  .det span { display: block; margin: .35rem 0; color: var(--dim); font-size: 1.05rem; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: .35rem; text-align: center; }
  .dow { color: var(--dim); font-size: .8rem; padding-bottom: .3rem; }
  .dy { position: relative; padding: .55rem 0; border-radius: .8rem; font-size: 1.15rem; }
  .dy.today { background: var(--accent); color: #0b0c10; font-weight: 700; }
  .dy i { position: absolute; left: 50%; bottom: .2rem; width: .35rem; height: .35rem; margin-left: -.175rem; border-radius: 50%; background: var(--accent); } .dy.today i { background: #0b0c10; }
  .mon { font-size: 1.5rem; margin-bottom: .8rem; }
  .ee { font-size: 2rem; flex: none; } .ew { color: var(--accent); font-size: .62em; font-weight: 600; margin-bottom: .1rem; }
  .ev { font-size: clamp(1.1rem, 1.8vw, 1.4rem); padding: .8rem 1.1rem; margin-bottom: .65rem; }
  .facts { margin-left: auto; display: grid; grid-template-columns: repeat(3, auto); gap: .7rem 1.6rem; }
  .fact { text-align: center; } .fact span { font-size: 1.4rem; } .fact b { display: block; font-size: 1.15rem; font-weight: 500; } .fact i { font-style: normal; color: var(--dim); font-size: .75rem; }
  .hrs { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .hrs .day { padding: .6rem .2rem; } .hrs .day .e { font-size: 1.6rem; } .hrs .day b { font-size: 1.2rem; }
  .wx-ico { font-size: clamp(4rem, 8vw, 6.5rem); } .wx-temp { font-size: clamp(3.5rem, 7vw, 5.5rem); }

  /* ---- draft / mockup marking: amber dashes + ribbon wherever data is sample ---- */
  .tag.draft { color: #ffb300; border: 1px dashed #ffb300; background: rgba(255,179,0,.12); font-weight: 600; }
  .card:has(.tag.draft) { border: 2px dashed rgba(255,179,0,.55); }
  .card:has(.tag.draft)::after { content: "✏️ DRAFT"; position: absolute; right: -3.4rem; bottom: 2.2rem; transform: rotate(-35deg); background: #ffb300; color: #201500;
    font-weight: 800; letter-spacing: .12em; font-size: .8rem; padding: .3rem 3.6rem; pointer-events: none; opacity: .92; }
  .addbar { margin-top: auto; padding-top: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; font-size: 1.1rem; line-height: 1.35; color: var(--dim); }
  .addbtn { padding: .8rem 1.4rem; border-radius: 999px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--text); font-size: 1.1rem; }
  .addbtn.go { background: var(--accent); color: #0b0c10; font-weight: 700; }

  /* ---- meals, heads-up, voice ---- */
  .plan { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7rem; }
  .pd { border-radius: 1.1rem; padding: .7rem .5rem; text-align: center; min-height: 7.6rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .pd .pl { color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .pd b { font-size: 1rem; font-weight: 500; line-height: 1.2; } .pd .pe { color: var(--dim); font-size: 1.6rem; margin-top: .6rem; }
  .pd .pic { width: 3.2rem; height: 3.2rem; font-size: 1.7rem; border-radius: .8rem; }
  .pa { display: flex; gap: .4rem; } .pa button { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: .6rem; padding: .25rem .7rem; font-size: 1rem; }
  .chip.gap { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
  #pauseBtn.on { border-color: #ffb74d; color: #ffb74d; background: rgba(255,183,77,.12); }
  #dailyBtn.on { border-color: #4caf7d; color: #4caf7d; background: rgba(76,175,125,.12); }
  .mz { position: absolute; right: .8rem; top: .8rem; z-index: 5; display: flex; gap: .4rem; align-items: center; padding: .4rem; border-radius: 999px; background: rgba(11,12,16,.78); }
  .mz button { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.12); font-size: 1.15rem; }
  .mz b { min-width: 3.2rem; text-align: center; font-weight: 500; }
  .mz button { width: auto; height: 2.6rem; padding: 0 1.1rem; border-radius: 999px; font-size: 1rem; }
  .sel { position: absolute; inset: 0; z-index: 4; display: none; cursor: crosshair; touch-action: none; background: rgba(0,0,0,.28); }
  .map.selecting .sel { display: block; }
  .sel .hint { position: absolute; left: 50%; top: 1rem; transform: translateX(-50%); background: #ffb300; color: #201500; padding: .4rem 1rem; border-radius: 999px; font-weight: 700; pointer-events: none; }
  .sel .box { display: none; position: absolute; border: 2px dashed #ffb300; background: rgba(255,179,0,.18); }
  .mz { top: .3rem; right: .3rem; padding: .15rem; gap: .15rem; opacity: .6; }
  .mz button { width: 1.6rem; height: 1.6rem; padding: 0; border-radius: 50%; font-size: .8rem; line-height: 1; }
  .ev[data-act] { cursor: pointer; } .ev.sel { outline: 2px solid var(--accent); }
  .plan { grid-template-columns: repeat(7, 1fr); gap: .5rem; } .pd b { font-size: .9rem; } .pd .pic { width: 2.8rem; height: 2.8rem; font-size: 1.5rem; }
  .warnbox { margin: -.6rem 0 1rem; padding: .6rem 1rem; border-radius: 1rem; background: rgba(255,179,0,.12); border: 1px dashed #ffb300; color: #ffcc66; font-size: .95rem; line-height: 1.35; }
  .rm { background: none; border: 0; color: var(--dim); font-size: .9rem; padding: .1rem .4rem; margin-left: auto; }
  .dimchip { opacity: .65; font-size: .95rem; padding: .4rem .9rem; }
  .sugs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; flex: 1; min-height: 0; }
  .sug { display: flex; flex-direction: column; padding: 1.1rem; border-radius: 1.2rem; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.01)); min-height: 0; }
  .sug .sh { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; } .sug .sh b { font-size: 1.3rem; font-weight: 500; } .sug .sh span { color: var(--dim); white-space: nowrap; }
  .sug > p { margin: .3rem 0 .6rem; color: var(--dim); font-size: 1.05rem; line-height: 1.35; }
  .sug .rec { font-size: .95rem; line-height: 1.4; overflow-y: auto; margin-bottom: .6rem; } .sug .rec p { margin: .2rem 0 .6rem; } .sug .rec ol { margin: .2rem 0; padding-left: 1.2rem; }
  .sug .sa { margin-top: auto; display: flex; gap: .4rem; flex-wrap: wrap; } .sug .sa .addbtn { padding: .5rem .8rem; font-size: .95rem; }
</style>

<body>
<main class="app">
  <header class="top">
    <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div><div class="milan" id="milan"></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <button class="priv" id="priv" aria-pressed="false"><span id="privIcon">👁</span><span id="privText">Full view</span></button>
    <button class="priv" id="pauseBtn" data-act="pause" aria-label="Pause or resume card rotation" title="Pause or resume card rotation">⏸</button>
    <button class="priv" id="voiceBtn" data-act="voice" aria-label="Change the reading voice" title="Change the reading voice">🗣</button>
    <button class="priv" data-act="speak" aria-label="Read this card aloud" title="Read this card aloud">🔊</button>
    <button class="priv" id="dailyBtn" data-act="daily" aria-label="Daily spoken suggestions at 5 PM" title="Daily spoken suggestions at 5 PM">🔔</button>
  </header>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <section class="stage" id="stage"></section>
</main>
<input type="file" id="rcpt" accept="image/*" capture="environment" hidden>

      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
        "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&hourly=precipitation_probability,temperature_2m,weather_code" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph" +
        "&timezone=America%2FChicago&forecast_days=5";
      const j = await (await fetch(url)).json();
      if (!j.current) throw new Error("bad response");
      const c = j.current, [desc, ico] = WMO(c.weather_code), feels = Math.round(c.apparent_temperature);
      const day = c.time.slice(0, 10), hr = c.time.slice(0, 13);
      const i = j.hourly.time.findIndex((t, k) => t.slice(0, 10) === day && t.slice(0, 13) >= hr && j.hourly.precipitation_probability[k] >= 50);
      let tip = feels <= 32 ? "Bundle up." : feels <= 50 ? "Bring a jacket." : feels <= 65 ? "A light layer is enough." : "No jacket needed.";
      if (i >= 0) { const h = +j.hourly.time[i].slice(11, 13); tip += " Rain likely around " + ((h % 12) || 12) + (h < 12 ? " AM." : " PM."); }
      WX = { state: "ok", temp: Math.round(c.temperature_2m), feels, desc, ico, wind: Math.round(c.wind_speed_10m),
        hi: Math.round(j.daily.temperature_2m_max[0]), lo: Math.round(j.daily.temperature_2m_min[0]), tip,
        days: j.daily.time.slice(1).map((t, k) => ({ name: new Date(t + "T12:00").toLocaleDateString([], { weekday: "short" }),
          hi: Math.round(j.daily.temperature_2m_max[k + 1]), lo: Math.round(j.daily.temperature_2m_min[k + 1]), ico: WMO(j.daily.weather_code[k + 1])[1] })) };
      try {   // extra details; the card still works if any of these are missing
        const t12 = (t) => { const h = +t.slice(11, 13); return ((h % 12) || 12) + ":" + t.slice(14, 16) + (h < 12 ? " AM" : " PM"); };
        const h0 = j.hourly.time.findIndex(t => t.slice(0, 13) === hr);
        Object.assign(WX, { hum: Math.round(c.relative_humidity_2m) + "%", rain: Math.round(j.daily.precipitation_probability_max[0]) + "%", uv: Math.round(j.daily.uv_index_max[0]),
          sr: t12(j.daily.sunrise[0]), ss: t12(j.daily.sunset[0]),
          hours: [1, 3, 5, 7, 9, 11].filter(k => h0 >= 0 && j.hourly.time[h0 + k]).map(k => { const h = +j.hourly.time[h0 + k].slice(11, 13);
            return { t: ((h % 12) || 12) + (h < 12 ? "a" : "p"), temp: Math.round(j.hourly.temperature_2m[h0 + k]), ico: WMO(j.hourly.weather_code[h0 + k])[1] }; }) });
      } catch (e) { console.warn("weather extras:", e.message || e); }
    } catch (e) { if (WX.state !== "ok") WX = { state: "error" }; }   // keep the last good reading on a hiccup
    if (WX.state === "ok") {
      try {
        const a = await (await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + LAT + "&longitude=" + LON + "&current=us_aqi,pm2_5")).json();
        const q = a.current.us_aqi;
        WX.air = { aqi: Math.round(q), pm: Math.round(a.current.pm2_5),
          label: q <= 50 ? "Good" : q <= 100 ? "Moderate" : q <= 150 ? "Unhealthy for sensitive groups" : q <= 200 ? "Unhealthy" : q <= 300 ? "Very unhealthy" : "Hazardous" };
      } catch (e) { /* air line simply stays hidden */ }
    }
    const el = cards()[cur]; if (el && CARDS[cur].id === "weather") el.innerHTML = CARDS[cur].render();
  }

  /* ===== group + order the sections (tab order = rotation order) ===== */
  const GROUP = { headsup: "Today", events: "Today", weather: "Today", safety: "Today",
                  kitchen: "Food", pantry: "Food", eatout: "Food", shop: "Food", money: "Money" };
  const ORDER = Object.keys(GROUP);
  CARDS.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
  CARDS.forEach(c => { const r = c.render; c.render = () => r().replace("<h2>", `<h2><span class="hi">${c.icon}</span>`); });

  /* ===== build UI ===== */
  CARDS.forEach((c, i) => {
    const t = document.createElement("button");
    t.className = "tab"; t.innerHTML = `<span>${c.icon}</span><span>${c.label}</span>`; t.setAttribute("aria-label", c.label);
    t.onclick = () => go(i);
    let g = $("nav").lastElementChild;
    if (!g || g.dataset.g !== GROUP[c.id]) { g = document.createElement("div"); g.className = "grp"; g.dataset.g = GROUP[c.id];
      g.innerHTML = `<div class="gl">${GROUP[c.id]}</div><div class="gi"></div>`; $("nav").appendChild(g); }
    g.querySelector(".gi").appendChild(t);
    const d = document.createElement("article"); d.className = "card"; d.style.setProperty("--accent", c.accent); $("stage").appendChild(d);
  });
  const tabs = () => [...document.querySelectorAll(".tab")], cards = () => [...document.querySelectorAll(".card")];

  function go(i) {
    if (ADD.phase === "listening" || ADD.phase === "confirm") ADD.phase = "idle";
    if (ADD.phase !== "saving") hold = false;
    cur = (i + CARDS.length) % CARDS.length; left = DWELL;
    cards().forEach((el, k) => { if (k === cur && !(CARDS[k].keep && el.innerHTML)) el.innerHTML = CARDS[k].render(); el.classList.toggle("show", k === cur); });
    tabs().forEach((t, k) => t.classList.toggle("on", k === cur));
    document.documentElement.style.setProperty("--accent", CARDS[cur].accent);
    fitMap(); tabs()[cur].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }

  $("priv").onclick = () => {
    privacy = !privacy;
    $("priv").classList.toggle("on", privacy); $("priv").setAttribute("aria-pressed", privacy);
    $("privIcon").textContent = privacy ? "🔒" : "👁"; $("privText").textContent = privacy ? "Limited view" : "Full view";
    refreshCard(CARDS[cur].id);
  };

  function tick() {
    const d = new Date();
    $("time").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    $("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    const rome = (o) => d.toLocaleString("en-US", { timeZone: "Europe/Rome", ...o });
    const rh = Number(rome({ hour: "numeric", hour12: false })) % 24;
    $("milan").innerHTML = `<span class="mdot ${rh >= 8 && rh < 22 ? "ok" : ""}"></span>Milan ${rome({ hour: "numeric", minute: "2-digit" })}`;
    dailyVoice(d); if (!hold && !PAUSED) left -= 1; $("prog").style.width = ((DWELL - left) / DWELL * 100) + "%";
    if (left <= 0) go(cur + 1);
  }
  $("dailyBtn").classList.toggle("on", DAILY); 
  go(0); tick(); setInterval(tick, 1000);
  loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
  loadEatOut(); setInterval(() => loadEatOut(), 6 * 60 * 60 * 1000);   // reuses the saved picks unless they're 12 h old
  loadEvents(); setInterval(loadEvents, 5 * 60 * 1000);
  DUMMY.shopping.forEach(i => fetchPhoto(i[3]));
  loadStock(); setInterval(loadStock, 10 * 60 * 1000);
  loadMeals(); setInterval(loadMeals, 10 * 60 * 1000);
  loadHeads(); setInterval(loadHeads, 15 * 60 * 1000);
  setInterval(() => { const f = document.querySelector(".map iframe"); if (f) f.src = f.src; }, 30 * 60 * 1000);   // reload the 911 dashboard for fresh data
</script>
</body>
</html>
