<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CoreHeart</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0c10;
    color: #f5f5f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .card { text-align: center; padding: 2rem; max-width: 90%; }
  h1 { font-size: 2.2rem; font-weight: 600; margin-bottom: 0.75rem; }
  p { font-size: 1.4rem; opacity: 0.88; line-height: 1.5; }
  .clock { font-size: 1rem; opacity: 0.5; margin-top: 2.5rem; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, Lorenzo & Giulia</h1>
    <p id="suggestion">Loading today's suggestion&hellip;</p>
    <div class="clock" id="clock"></div>
  </div>

  <script>
    // Replace with your deployed Worker URL after `wrangler deploy`.
    const WORKER_URL = "https://core-heart.llacognata.workers.dev";

    // No secret here on purpose — the tablet's Fully Kiosk app injects the
    // X-Hub-Secret header at the HTTP layer (Settings > Web Content > Inject
    // Custom Headers), so it never appears in this file or page source.
    async function loadSuggestion() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        document.getElementById("suggestion").textContent = data.suggestion;
      } catch (err) {
        document.getElementById("suggestion").textContent =
          "CoreHeart is live. Suggestion engine not connected yet.";
      }
    }

    function tickClock() {
      document.getElementById("clock").textContent = new Date().toLocaleString();
    }

    loadSuggestion();
    tickClock();
    setInterval(tickClock, 1000);
    setInterval(loadSuggestion, 60000); // poll every minute; cheap at this volume
  </script>
</body>
</html>
